[project]
name = "platform-demo"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "click>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
platform = "platform_generator.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_generator"]

[tool.pytest.ini_options]
pythonpath = ["."]